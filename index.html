<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Gestão</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="logo-container">
    <img src="/logo.png" alt="Logo Sistema de Gestão">
</div>

    <!-- Cabeçalho da página -->
    <header>
        <h1>Sistema de Gestão</h1>
        <p>Cadastro e visualização de produtos</p>
    </header>

    <!-- Conteúdo principal -->
    <main>

        <!-- Seção de cadastro -->
        <section class="card">

            <h2>CADASTRO</h2>

            <form>

                <!-- Nome do produto -->
                <div class="grupo">
                    <label for="nome">Nome do Produto</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome"
                        required>
                </div>


                <!-- Categoria -->
                <div class="grupo">
                    <label for="categoria">Categoria</label>

                    <select id="categoria" required>
                        <option value="">Selecione</option>
                        <option value="Informática">Informática</option>
                        <option value="Eletrônicos">Eletrônicos</option>
                        <option value="Escritório">Escritório</option>
                    </select>
                </div>


                <!-- Quantidade -->
                <div class="grupo">
                    <label for="quantidade">Quantidade</label>

                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        placeholder="Digite a quantidade"
                        required>
                </div>


                <!-- Preço -->
                <div class="grupo">
                    <label for="preco">Preço</label>

                    <input
                        type="number"
                        id="preco"
                        min="0.01"
                        step="0.01"
                        placeholder="0,00"
                        required>
                </div>


                <!-- CEP -->
                <div class="grupo">
                    <label for="cep">CEP</label>

                    <input
                        type="text"
                        id="cep"
                        placeholder="Digite o CEP"
                        maxlength="9"
                        required>
                </div>


                <!-- Endereço -->
                <div class="grupo">
                    <label for="endereco">Endereço</label>

                    <input
                        type="text"
                        id="endereco"
                        placeholder="Rua / Avenida"
                        readonly>
                </div>


                <!-- Bairro -->
                <div class="grupo">
                    <label for="bairro">Bairro</label>

                    <input
                        type="text"
                        id="bairro"
                        placeholder="Bairro"
                        readonly>
                </div>


                <!-- Cidade -->
                <div class="grupo">
                    <label for="cidade">Cidade</label>

                    <input
                        type="text"
                        id="cidade"
                        placeholder="Cidade"
                        readonly>
                </div>


                <!-- Estado -->
                <div class="grupo">
                    <label for="estado">Estado</label>

                    <input
                        type="text"
                        id="estado"
                        placeholder="UF"
                        readonly>
                </div>


                <!-- Botão -->
                <button type="submit">
                    Cadastrar
                </button>

            </form>

        </section>


        <!-- Seção de visualização dos produtos -->
        <section class="card">

            <h2>Produtos Cadastrados</h2>

            <div class="tabela">

                <table>

                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>Notebook</td>
                            <td>Informática</td>
                            <td>10</td>
                            <td>R$ 3.500,00</td>
                        </tr>

                        <tr>
                            <td>Mouse</td>
                            <td>Informática</td>
                            <td>30</td>
                            <td>R$ 80,00</td>
                        </tr>

                        <tr>
                            <td>Cadeira</td>
                            <td>Escritório</td>
                            <td>15</td>
                            <td>R$ 650,00</td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Rodapé -->
    <footer>
        <p>© 2026 Sistema de Gestão</p>
    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
